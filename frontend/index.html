<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Warmline · AI sales and support assistant for small businesses</title>
    <meta
      name="description"
      content="Warmline answers customer questions from your FAQ, captures leads and books appointments, always confirming with the customer before it saves anything."
    />
    <meta name="theme-color" content="#faf7f2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews (Slack, WhatsApp, LinkedIn...). Their crawlers do not run JavaScript, so
         these tags are the same for every page. %SITE_URL% is filled in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warmline" />
    <meta property="og:title" content="Warmline · AI sales and support assistant" />
    <meta
      property="og:description"
      content="Answers from your FAQ, lead capture and bookings, with the customer's confirmation before anything is saved."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>Warmline needs JavaScript to run. Please turn it on and reload the page.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
