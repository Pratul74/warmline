# Production stack on one server: nginx (web) -> FastAPI (api) -> Postgres + pgvector (db).
# Only "web" publishes ports. Always run it through ./compose.sh, which sets APP_TAG
# (the deployed image tag). Values like ${POSTGRES_USER} come from the .env file next to
# this file (/opt/warmline/.env on the server).
name: warmline

# Docker log rotation for every container: at most 3 x 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Small-server tuning: 64 MB shared buffers (default 128 MB), fewer connections.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300m
    logging: *logging
    # No "ports": Postgres is reachable only on the internal network, never from the host
    # or the internet.

  api:
    image: ${REGISTRY_IMAGE:?set REGISTRY_IMAGE in .env}:api-${APP_TAG:?run through ./compose.sh}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Trust X-Forwarded-For/-Proto only from this compose network (where nginx lives),
      # so the app sees the real client IP and https.
      FORWARDED_ALLOW_IPS: 172.30.0.0/24
    # No migrations here: deploy.sh runs them once, as a separate step. (The image's
    # default command also migrates, which would crash-loop an older image after a rollback.)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350m
    logging: *logging
    # No "ports": only nginx reaches the api, over the internal network.

  web:
    image: ${REGISTRY_IMAGE}:web-${APP_TAG}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      # Certificate and key, copied here by the Certbot deploy hook (owner uid 101).
      - ./certs:/etc/nginx/certs:ro
      # Certbot's webroot for HTTP-01 challenge files.
      - ./webroot:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging
    # No depends_on: nginx starts even if the api is down, so the ACME challenge and the
    # HTTPS redirect keep working.

networks:
  default:
    # Fixed range so FORWARDED_ALLOW_IPS above can name it. Does not overlap the default
    # AWS VPC range (172.31.0.0/16).
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
