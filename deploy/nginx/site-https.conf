# The production site: HTTP only redirects (except the ACME challenge), HTTPS serves the
# static frontend and proxies /api/ to the backend. nginx listens on 8080/8443 inside the
# container because it runs as an unprivileged user; Docker maps host ports 80/443 to them.

server {
    listen 8080 default_server;
    server_name _;

    # Renewal challenges must keep working over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Container health check (used by the image's HEALTHCHECK). Public and harmless: it
    # only says "ok". No allow/deny here: "return" runs before access checks, so they
    # would have no effect.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    server_name _;

    # Copied here from /etc/letsencrypt by the Certbot deploy hook; mounted read-only.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Mozilla "intermediate" profile: TLS 1.2 and 1.3 only, forward-secret AEAD ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WarmlineTLS:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;

    # The API. The trailing slash in proxy_pass strips the /api prefix: /api/health -> /health.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        # The backend's FAQ upload limit is 1 MiB of file. The multipart body is a little
        # larger, so nginx allows 2 MiB and lets the backend send its own clear 413 message.
        client_max_body_size 2m;

        proxy_pass http://warmline_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat replies are one JSON response (no streaming), but one reply can take several
        # model calls (LLM_TIMEOUT_SECONDS=30 each, plus retries), so allow up to 120 s.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Vite's hashed files (name changes when content changes): cache for a year.
    # A missing file is a real 404, not index.html, so an old tab can detect a new deploy.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell: always revalidate, so a new deploy is picked up at once.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else: a real file (favicon, robots.txt) or the SPA (React Router decides).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
