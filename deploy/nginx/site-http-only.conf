# WARMLINE_BOOTSTRAP (the certificate hook looks for this marker)
# Used only while no certificate exists yet: it answers the Let's Encrypt HTTP-01
# challenge so the first certificate can be issued. The app itself is NOT served over
# plain HTTP, because logins and chats must never travel unencrypted.

server {
    listen 8080 default_server;
    server_name _;

    # Certbot (on the host) writes challenge files here; Let's Encrypt fetches them over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Container health check (used by the image's HEALTHCHECK). Public and harmless: it
    # only says "ok". No allow/deny here: "return" runs before access checks, so they
    # would have no effect.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 503 "HTTPS is being set up. Try again in a few minutes.\n";
    }
}
