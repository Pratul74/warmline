# Security headers, included in EVERY location of the HTTPS server.
# Why in every location: if a location has any add_header of its own, nginx drops all
# add_header lines inherited from the server block. Including this file everywhere avoids
# that trap. "always" also sends the headers on error responses (4xx, 5xx).

# The CSP from frontend/README.md. The API is on the same origin (/api), so connect-src is
# 'self'. style-src needs 'unsafe-inline' because Radix positions menus with inline styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $warmline_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS is OFF until HTTPS is verified on the real domain (Stage 3). Then uncomment, first
# with max-age=300, later max-age=31536000. No includeSubDomains: we only control this host.
# add_header Strict-Transport-Security "max-age=300" always;
