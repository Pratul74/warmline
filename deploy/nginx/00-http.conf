# http-level settings, shared by both site configs. Loaded from /etc/nginx/conf.d/.

# Do not reveal the nginx version in headers or error pages.
server_tokens off;

# Docker's internal DNS. nginx asks it again every 10 s, so a recreated api container
# (new IP address) is found without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# The backend. "resolve" lets nginx start even when the api container is down (it answers
# 502 until the api is back), so certificates and the ACME challenge never depend on the api.
upstream warmline_api {
    zone warmline_api 64k;
    server api:8000 resolve;
}

# Chat links (/c/<id>) carry the integration id: never send them to other sites in the
# Referer header. $request_uri is the original URL, before the SPA fallback rewrites it.
map $request_uri $warmline_referrer_policy {
    default "strict-origin-when-cross-origin";
    ~^/c/   "no-referrer";
}
